<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Kauê de Oliveira Freitas - Estudante de Ciência da Computação">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1f"/>
      <stop offset="0.6" stop-color="#0a1f4d"/>
      <stop offset="1" stop-color="#0d3b8f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#4d7cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="880" height="280" rx="24" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="260" rx="18" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="10" y="10" width="880" height="280" rx="24" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="2" fill="#e6f4ff" filter="url(#glow)">KAUÊ DE OLIVEIRA FREITAS</text>
  <text x="450" y="123" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#7fd6ff">Estudante de Ciência da Computação</text>
  <text x="450" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb6d9">Patos, Paraíba, Brasil  ·  UEPB</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#00e5ff" text-anchor="middle">
    <rect x="249" y="170" width="90" height="28" rx="14" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="294" y="189">Java</text>
    <rect x="353" y="170" width="90" height="28" rx="14" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="398" y="189">Python</text>
    <rect x="457" y="170" width="90" height="28" rx="14" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="502" y="189">Django</text>
    <rect x="561" y="170" width="90" height="28" rx="14" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="606" y="189">Web</text>
  </g>

  <line x1="120" y1="222" x2="780" y2="222" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="1"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6f4ff" text-anchor="middle">
    <rect x="49" y="240" width="190" height="32" rx="16" fill="#4d7cff" fill-opacity="0.15" stroke="#4d7cff" stroke-opacity="0.8"/>
    <text x="144" y="260">in/seu-usuario</text>
    <rect x="253" y="240" width="190" height="32" rx="16" fill="#4d7cff" fill-opacity="0.15" stroke="#4d7cff" stroke-opacity="0.8"/>
    <text x="348" y="260">seu-email@dominio.com</text>
    <rect x="457" y="240" width="190" height="32" rx="16" fill="#4d7cff" fill-opacity="0.15" stroke="#4d7cff" stroke-opacity="0.8"/>
    <text x="552" y="260">@seu-usuario</text>
    <rect x="661" y="240" width="190" height="32" rx="16" fill="#4d7cff" fill-opacity="0.15" stroke="#4d7cff" stroke-opacity="0.8"/>
    <text x="756" y="260">Kaue-Oliveira-Freitas</text>
  </g>
</svg>
